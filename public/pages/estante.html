<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Estante - B5A</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/comunidade.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* Estilo exclusivo para os livros da estante */
        .estante-grid {
            display: flex; flex-wrap: wrap; gap: 20px; margin-top: 30px;
        }
        .livro {
            width: 150px; height: 220px;
            background: linear-gradient(135deg, #2a221b, #111);
            border: 2px solid var(--gold); border-radius: 5px 10px 10px 5px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
            position: relative; overflow: hidden;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }
        .livro:hover { transform: translateY(-10px) scale(1.05); box-shadow: 8px 15px 25px rgba(0,0,0,0.8); }
        .livro::before {
            content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.1);
        }
        .livro-texto {
            writing-mode: vertical-rl; text-orientation: mixed;
            transform: rotate(180deg); font-family: 'Bebas Neue', sans-serif;
            color: var(--gold); font-size: 1.5rem; letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Home</a>
        <div class="nav-user"><span id="status-login" class="status-login-nav">🔴 Offline</span><button id="btn-login" class="btn-login-nav">Entrar com Google</button></div>
    </nav>

    <div class="conteudo-texto" style="margin-top: 80px;">
        <h1>📚 Minha Estante</h1>
        <p>Estes são os seus Arquivistas registrados. Clique em um livro para abrir a ficha e retomar a sua história.</p>
        
        <div id="estante-container" class="estante-grid">
            <!-- Os livros vão aparecer aqui -->
        </div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/estante.js"></script>
</body>
</html>
