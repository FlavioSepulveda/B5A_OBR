<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal - B5A</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/comunidade.css">
    <link rel="stylesheet" href="../css/cartas.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Home</a>
        <div class="nav-user">
            <span id="status-login" class="status-login-nav">🔴 Offline</span>
            <button id="btn-login" class="btn-login-nav">Entrar com Google</button>
        </div>
    </nav>

    <div class="comunidade-container">
        <div class="painel-escrita">
            <h2>Forjar Arma</h2>
            <div class="input-group" style="background: #111; padding: 15px; border-radius: 5px; border: 1px solid var(--gold); display: flex; flex-direction: column; gap: 10px;">
                
                <div class="input-group">
                    <label>Nome da Arma (Obrigatório)</label>
                    <input type="text" id="form-titulo" placeholder="Ex: Lâmina da Tempestade">
                </div>
                
                <div class="row-inputs">
                    <div class="input-group">
                        <label>Categoria (Obrigatório)</label>
                        <select id="form-categoria" onchange="atualizarDadosArma()">
                            <option value="Leve">Leve</option>
                            <option value="Média">Média</option>
                            <option value="Pesada">Pesada</option>
                            <option value="Precisão">Precisão</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Dano Base</label>
                        <input type="text" id="form-dano" readonly style="background: #222; color: var(--gold); font-weight: bold;">
                    </div>
                    <div class="input-group">
                        <label>Crítico (Soma)</label>
                        <input type="text" id="form-critico" readonly style="background: #222; color: var(--gold); font-weight: bold;">
                    </div>
                </div>
                
                <div class="row-inputs">
                    <div class="input-group">
                        <label>Efeito (Opcional)</label>
                        <input type="text" id="form-efeito" placeholder="Ex: +2 de dano">
                    </div>
                    <div class="input-group">
                        <label>Descarte (Opcional)</label>
                        <input type="text" id="form-descarte" placeholder="Ex: +1d6 por dado">
                    </div>
                </div>

                <div class="input-group">
                    <label>Imagem do Item (Opcional)</label>
                    <!-- O input agora aceita arquivos de imagem -->
                    <input type="file" id="form-arquivo" accept="image/*" style="background: #111; color: #ccc; padding: 8px; border: 1px solid #333; border-radius: 4px;">
                    <small style="color: #888; font-size: 0.7rem; margin-top: 5px;">Ou cole um link:</small>
                    <input type="url" id="form-imagem" placeholder="Link da imagem (Opcional)">
                </div>

                <div class="input-group">
                    <label>Descrição / Lore (Opcional)</label>
                    <textarea id="form-texto" rows="3" placeholder="De onde ela veio?"></textarea>
                </div>
                
                <button id="btn-salvar-form" class="btn-primario" style="padding: 10px; margin-top: 10px;">Salvar no Arsenal</button>
                <p id="status-form" style="font-size: 0.8rem; color: #888; text-align: center;"></p>
            </div>
        </div>

        <div class="painel-feed">
            <h2>Arsenal</h2>
            <div id="lista-cartas" class="grid-cartas"></div>
        </div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/motor_cartas.js"></script>
    <script>
        window.atualizarDadosArma = function() {
            const categoria = document.getElementById('form-categoria').value;
            const inputDano = document.getElementById('form-dano');
            const inputCritico = document.getElementById('form-critico');

            const tabelaArmas = {
                "Leve": { dano: "1d4", critico: "+1d4" },
                "Média": { dano: "1d6", critico: "+1d6" },
                "Pesada": { dano: "2d10", critico: "+1d10" },
                "Precisão": { dano: "1d6", critico: "+1d6" }
            };

            const valores = tabelaArmas[categoria] || tabelaArmas["Média"];
            inputDano.value = valores.dano;
            inputCritico.value = valores.critico;
        };

        window.onload = () => {
            if (typeof iniciarCartas === 'function') {
                iniciarCartas("armas");
                atualizarDadosArma();
            } else {
                setTimeout(() => { iniciarCartas("armas"); atualizarDadosArma(); }, 500);
            }
        };
    </script>
</body>
</html>
