<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal - B5A</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/comunidade.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Home</a>
        <div class="nav-user">
            <span id="status-login" class="status-login-nav">🔴 Offline</span>
            <button id="btn-login" class="btn-login-nav">Entrar com Google</button>
        </div>
    </nav>

    <div class="comunidade-container">
        <div class="painel-escrita">
            <h2>Forjar Arma</h2>
            <div class="input-group" style="background: #111; padding: 15px; border-radius: 5px; border: 1px solid var(--gold); display: flex; flex-direction: column; gap: 10px;">
                <div class="input-group">
                    <label>Nome da Arma</label>
                    <input type="text" id="form-titulo" placeholder="Ex: Lâmina da Tempestade">
                </div>
                
                <div class="row-inputs">
                    <div class="input-group">
                        <label>Categoria</label>
                        <select id="form-categoria">
                            <option value="Leve">Leve (1d4)</option>
                            <option value="Média">Média (1d6)</option>
                            <option value="Pesada">Pesada (2d10)</option>
                            <option value="Precisão">Precisão</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Efeito Base</label>
                        <input type="text" id="form-efeito" placeholder="Ex: +1d6 de dano">
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Efeito com Descartes</label>
                    <input type="text" id="form-descarte" placeholder="Ex: +1d6 por dado descartado">
                </div>

                <div class="input-group">
                    <label>URL da Imagem da Arma</label>
                    <input type="url" id="form-imagem" placeholder="Link da imagem">
                </div>

                <div class="input-group">
                    <label>Descrição / Lore</label>
                    <textarea id="form-texto" rows="3" placeholder="De onde ela veio?"></textarea>
                </div>
                
                <button id="btn-salvar-form" class="btn-primario" style="padding: 10px; margin-top: 10px;">Salvar no Arsenal</button>
                <p id="status-form" style="font-size: 0.8rem; color: #888; text-align: center;"></p>
            </div>
        </div>

        <div class="painel-feed">
            <h2>Arsenal da Comunidade</h2>
            <div id="lista-feed" class="grid-cronicas"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-item" class="modal-leitura">
        <div class="modal-leitura-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <img id="modal-img" src="" class="modal-capa" style="background-color: #111;">
            <h2 id="modal-titulo">Nome</h2>
            <p id="modal-subtitulo" style="color: var(--gold); font-size: 0.9rem; margin-bottom: 10px;"></p>
            <div id="modal-texto" style="line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap;"></div>
            
            <div id="modal-habilidades" style="background: #111; padding: 10px; border: 1px solid #333; border-radius: 4px; margin-bottom: 20px;"></div>

            <div style="display: flex; gap: 10px;">
                <button id="btn-like" class="btn-curtir" onclick="alternarLike()" style="flex: 1;">
                    ❤️ Curtir (<span id="qtd-likes">0</span>)
                </button>
                <button id="btn-editar" class="btn-primario" style="display: none; flex: 1;" onclick="prepararEdicao()">Editar</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/armas.js"></script>
</body>
</html>
