<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiário - B5A</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/comunidade.css">
    <link rel="stylesheet" href="../css/cartas.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Home</a>
        <div class="nav-user">
            <span id="status-login" class="status-login-nav">🔴 Offline</span>
            <button id="btn-login" class="btn-login-nav">Entrar com Google</button>
        </div>
    </nav>

    <div class="comunidade-container">
        <div class="painel-escrita">
            <h2>Registrar Monstro</h2>
            
            <input type="hidden" id="edit-item-id" value="">

            <div class="input-group" style="background: #111; padding: 15px; border-radius: 5px; border: 1px solid var(--gold); display: flex; flex-direction: column; gap: 10px;">
                
                <div class="input-group">
                    <label>Nome do Monstro (Obrigatório)</label>
                    <input type="text" id="form-titulo" placeholder="Ex: O Tirano de Cinzas">
                </div>
                
                <div class="row-inputs">
                    <div class="input-group">
                        <label>Vida (PV)</label>
                        <input type="number" id="form-vida" value="10">
                    </div>
                    <div class="input-group">
                        <label>Defesa (TA)</label>
                        <input type="number" id="form-ta" value="12">
                    </div>
                    <div class="input-group">
                        <label>Nível de Ameaça</label>
                        <select id="form-nivel">
                            <option value="Comum">Comum</option>
                            <option value="Ameaça">Ameaça</option>
                            <option value="Chefe">Chefe</option>
                        </select>
                    </div>
                </div>

                <!-- NOVA SEÇÃO DE ATRIBUTOS -->
                <label style="color: var(--gold); margin-top: 10px; margin-bottom: 5px; display: block; font-size: 0.9rem;">Atributos Base (Dados d4)</label>
                <div class="row-inputs">
                    <div class="input-group">
                        <label>Vigor</label>
                        <input type="text" id="form-vigor" placeholder="Ex: 2d4" value="1d4">
                    </div>
                    <div class="input-group">
                        <label>Dinamismo</label>
                        <input type="text" id="form-dinamismo" placeholder="Ex: 1d4" value="1d4">
                    </div>
                </div>
                <div class="row-inputs" style="margin-top: 5px;">
                    <div class="input-group">
                        <label>Razão</label>
                        <input type="text" id="form-razao" placeholder="Ex: 1d4" value="1d4">
                    </div>
                    <div class="input-group">
                        <label>Determinação</label>
                        <input type="text" id="form-determinacao" placeholder="Ex: 1d4" value="1d4">
                    </div>
                </div>
                <!-- FIM DA SEÇÃO DE ATRIBUTOS -->
                
                <div class="row-inputs" style="margin-top: 10px;">
                    <div class="input-group">
                        <label>Atributo Dominante</label>
                        <select id="form-dominante">
                            <option value="Vigor">Vigor</option>
                            <option value="Dinamismo">Dinamismo</option>
                            <option value="Razão">Razão</option>
                            <option value="Determinação">Determinação</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Espectro</label>
                        <select id="form-espectro">
                            <option value="padrao">Nenhum</option>
                            <option value="igneo">Ígneo</option>
                            <option value="celeste">Celeste</option>
                            <option value="viridiano">Viridiano</option>
                            <option value="solar">Solar</option>
                            <option value="indigo">Índigo</option>
                            <option value="alabastro">Alabastro</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Imagem do Item (Opcional)</label>
                    <input type="file" id="form-arquivo" accept="image/*" style="background: #111; color: #ccc; padding: 8px; border: 1px solid #333; border-radius: 4px;">
                    <small style="color: #888; font-size: 0.7rem; margin-top: 5px;">Ou cole um link:</small>
                    <input type="url" id="form-imagem" placeholder="Link da imagem (Opcional)">
                </div>

                <div class="input-group">
                    <label>Descrição Principal (Opcional)</label>
                    <textarea id="form-texto" rows="3" placeholder="Descreva a criatura..."></textarea>
                </div>

                <label style="color: var(--gold); margin-top: 10px; margin-bottom: 5px; display: block; font-size: 0.9rem;">Habilidades da Criatura</label>
                
                <div class="row-inputs">
                    <input type="text" id="form-hab1-custo" placeholder="Custo 1" style="width: 30%;">
                    <input type="text" id="form-hab1-desc" placeholder="Habilidade 1" style="width: 70%;">
                </div>
                <div class="row-inputs">
                    <input type="text" id="form-hab2-custo" placeholder="Custo 2" style="width: 30%;">
                    <input type="text" id="form-hab2-desc" placeholder="Habilidade 2" style="width: 70%;">
                </div>
                <div class="row-inputs">
                    <input type="text" id="form-hab3-custo" placeholder="Custo 3" style="width: 30%;">
                    <input type="text" id="form-hab3-desc" placeholder="Habilidade 3" style="width: 70%;">
                </div>
                
                <button id="btn-salvar-form" class="btn-primario" style="padding: 10px; margin-top: 10px;">Salvar Monstro</button>
                <p id="status-form" style="font-size: 0.8rem; color: #888; text-align: center;"></p>
            </div>
        </div>

        <div class="painel-feed">
            <h2>Bestiário</h2>
            <div id="lista-cartas" class="grid-cartas"></div>
        </div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/motor_cartas.js"></script>
    <script>
        window.onload = () => {
            if (typeof iniciarCartas === 'function') iniciarCartas("monstros");
        };
    </script>
</body>
</html>
