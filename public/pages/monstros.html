<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiário das Almas - Biblioteca da 5ª Avenida</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/comunidade.css">
</head>
<body>
    <header class="topo-biblioteca">
        <a href="../index.html" class="btn-voltar">← Voltar à Biblioteca</a>
        <h1>Bestiário das Almas</h1>
        <p>Registre anomalias, feras e entidades encontradas entre as estantes.</p>
    </header>

    <main class="container-comunidade">
        <!-- FORMULÁRIO DE CRIAÇÃO / EDIÇÃO -->
        <section class="caixa-criar-cronica">
            <h2 id="titulo-form-monstro">Registrar Nova Criatura</h2>
            <input type="hidden" id="monstro-edit-id" value="">

            <div class="grid-form-2">
                <div>
                    <label>Nome da Criatura *</label>
                    <input type="text" id="monstro-nome" placeholder="Ex: O Tirano de Cinzas">
                </div>
                <div>
                    <label>Imagem da Criatura (Opcional)</label>
                    <input type="file" id="monstro-img-input" accept="image/*">
                    <img id="monstro-img-preview" style="display:none; max-height:120px; margin-top:8px; border-radius:6px; border:1px solid #444;">
                </div>
            </div>

            <div class="grid-form-3" style="margin-top: 12px;">
                <div>
                    <label>Natureza / Tipagem</label>
                    <select id="monstro-natureza">
                        <option value="Fera">Fera</option>
                        <option value="Humanoide">Humanoide</option>
                        <option value="Manifestação">Manifestação</option>
                        <option value="Construto">Construto</option>
                        <option value="Anomalia">Anomalia</option>
                        <option value="Entidade">Entidade</option>
                        <option value="Arquivista">Arquivista</option>
                        <option value="Relíquia Viva">Relíquia Viva</option>
                    </select>
                </div>
                <div>
                    <label>Espectro Predominante</label>
                    <select id="monstro-espectro">
                        <option value="Ígneo">Ígneo (Vermelho)</option>
                        <option value="Celeste">Celeste (Azul)</option>
                        <option value="Viridiano">Viridiano (Verde)</option>
                        <option value="Solar">Solar (Amarelo)</option>
                        <option value="Índigo">Índigo (Violeta)</option>
                        <option value="Alabastro">Alabastro (Branco)</option>
                    </select>
                </div>
                <div>
                    <label>Nível de Ameaça / Volume</label>
                    <input type="text" id="monstro-ameaca" placeholder="Ex: Comum | Vol. I ou Chefe | Vol. V">
                </div>
            </div>

            <div class="grid-form-3" style="margin-top: 12px;">
                <div>
                    <label>Atributo Dominante (Testes Contra)</label>
                    <select id="monstro-atributo">
                        <option value="Vigor">Vigor</option>
                        <option value="Dinamismo">Dinamismo</option>
                        <option value="Razão">Razão</option>
                        <option value="Determinação">Determinação</option>
                    </select>
                </div>
                <div>
                    <label>Pontos de Vida (PV)</label>
                    <input type="number" id="monstro-pv" value="15" min="1">
                </div>
                <div>
                    <label>Taxa de Acerto (TA)</label>
                    <input type="number" id="monstro-ta" value="12" min="1">
                </div>
            </div>

            <div style="margin-top: 12px;">
                <label>Descritor & Ataques Básicos</label>
                <textarea id="monstro-desc" rows="3" placeholder="Aparência, comportamento e ataques básicos (ex: Mordida Incandescente: 1d12 + 3d4 + 1 | Dano: 1d4+2)..."></textarea>
            </div>

            <!-- 3 SLOTS DE HABILIDADES -->
            <div style="margin-top: 16px;">
                <label style="font-weight:bold; color:#d4af37;">Habilidades da Criatura (Até 3 Slots)</label>
                
                <div class="slot-habilidade" style="margin-top:8px; padding:10px; background:rgba(0,0,0,0.25); border-radius:6px;">
                    <input type="text" id="hab1-nome" placeholder="Slot 1 — Nome e Custo (ex: Aura de Calor - Passiva)">
                    <textarea id="hab1-desc" rows="2" placeholder="Efeito da habilidade 1..." style="margin-top:6px;"></textarea>
                </div>

                <div class="slot-habilidade" style="margin-top:8px; padding:10px; background:rgba(0,0,0,0.25); border-radius:6px;">
                    <input type="text" id="hab2-nome" placeholder="Slot 2 — Nome e Custo (ex: Rugido do Desafio - 3 PI)">
                    <textarea id="hab2-desc" rows="2" placeholder="Efeito da habilidade 2..." style="margin-top:6px;"></textarea>
                </div>

                <div class="slot-habilidade" style="margin-top:8px; padding:10px; background:rgba(0,0,0,0.25); border-radius:6px;">
                    <input type="text" id="hab3-nome" placeholder="Slot 3 (Capstone) — Nome e Custo (ex: Chama Devoradora - 4 PI)">
                    <textarea id="hab3-desc" rows="2" placeholder="Efeito da habilidade 3..." style="margin-top:6px;"></textarea>
                </div>
            </div>

            <div style="margin-top: 16px; display:flex; gap:10px;">
                <button id="btn-salvar-monstro" class="btn-principal">Salvar no Bestiário</button>
                <button id="btn-cancelar-edicao-monstro" class="btn-secundario" style="display:none;">Cancelar Edição</button>
            </div>
        </section>

        <!-- FEED DE CRIATURAS -->
        <section id="lista-monstros" class="feed-cronicas"></section>
    </main>

    <script type="module" src="../js/monstros.js"></script>
</body>
</html>
