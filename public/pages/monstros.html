<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiário - B5A</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/comunidade.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Home</a>
        <div class="nav-user"><span id="status-login" class="status-login-nav">🔴 Offline</span><button id="btn-login" class="btn-login-nav">Entrar com Google</button></div>
    </nav>

    <div class="comunidade-container">
        <!-- FORMULÁRIO DE MONSTRO -->
        <div class="painel-escrita">
            <h2>Criar Criatura</h2>
            <div class="input-group" style="background: #111; padding: 15px; border-radius: 5px; border: 1px solid var(--gold); display: flex; flex-direction: column; gap: 10px;">
                <div class="input-group">
                    <label>Nome da Criatura</label>
                    <input type="text" id="monstro-nome" placeholder="Ex: Lobo Cinzento">
                </div>
                <div class="row-inputs">
                    <div class="input-group">
                        <label>Vida (PV)</label>
                        <input type="number" id="monstro-pv" value="10">
                    </div>
                    <div class="input-group">
                        <label>TA (Taxa de Acerto)</label>
                        <input type="number" id="monstro-ta" value="12">
                    </div>
                </div>
                <div class="input-group">
                    <label>Espectro</label>
                    <select id="monstro-espectro">
                        <option value="Fera">Fera</option>
                        <option value="Manifestação">Manifestação</option>
                        <option value="Construto">Construto</option>
                        <option value="Anomalia">Anomalia</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Descrição / Habilidades</label>
                    <textarea id="monstro-desc" rows="5" placeholder="Ataques, comportamentos..."></textarea>
                </div>
                <button id="btn-salvar-monstro" class="btn-primario" style="padding: 10px;">Registrar no Bestiário</button>
            </div>
        </div>

        <!-- FEED DE MONSTROS -->
        <div class="painel-feed">
            <h2>Criaturas Registradas</h2>
            <div id="lista-monstros" class="grid-cronicas"></div>
        </div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/monstros.js"></script>
</body>
</html>
