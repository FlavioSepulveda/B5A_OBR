<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - B5A</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Home</a>
        <div class="nav-user">
            <a href="perfil.html" id="status-login" class="status-login-nav" style="text-decoration: none; color: #888;">🔴 Offline</a>
            <button id="btn-login" class="btn-login-nav">Entrar com Google</button>
        </div>
    </nav>

    <div class="perfil-container" id="perfil-visitado">
        <div class="perfil-identidade">
            <img id="perfil-avatar" src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="avatar">
            <h2 id="perfil-nome">Carregando...</h2>
            <p id="perfil-bio" class="bio-texto">"Sem juramento registrado."</p>
            
            <div class="stats-seguidores">
                <span>👥 <strong id="qtd-seguidores">0</strong> Seguidores</span>
            </div>

            <div id="area-botoes-perfil" class="botoes-perfil-wrapper">
                <button id="btn-seguir" class="btn-primario" style="display: none;">Seguir Arquivista</button>
                <button id="btn-editar-perfil" class="btn-primario btn-secundario" style="display: none;">Editar Meu Perfil</button>
            </div>
        </div>

        <div class="perfil-conteudo">
            <h3 class="titulo-secao">Conquistas da Biblioteca</h3>
            <div id="lista-selos" class="selos-grid">
                <p style="color: #666; font-style: italic;">Nenhum selo conquistado ainda.</p>
            </div>

            <div class="abas-perfil">
                <button class="tab-btn active" onclick="mudarTabPerfil(event, 'tab-estante')">Estante Pública</button>
                <button class="tab-btn" onclick="mudarTabPerfil(event, 'tab-obras')">Obras Criadas</button>
            </div>

            <div id="tab-estante" class="tab-conteudo active">
                <div id="lista-estante-publica" class="grid-mini-cards"></div>
            </div>
            <div id="tab-obras" class="tab-conteudo">
                <div id="lista-obras-publicas" class="grid-mini-cards"></div>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="modal-editar-perfil" class="modal-leitura" style="display:none;">
        <div class="modal-leitura-content">
            <span class="close-btn" onclick="document.getElementById('modal-editar-perfil').style.display='none'">&times;</span>
            <h2>Editar Identidade</h2>
            
            <div class="input-group">
                <label>Apelido de Arquivista</label>
                <input type="text" id="edit-apelido" placeholder="Como quer ser chamado?">
            </div>
            <div class="input-group">
                <label>Juramento / Bio</label>
                <textarea id="edit-bio" rows="3" placeholder="Sua frase de efeito..."></textarea>
            </div>
            <div class="input-group">
                <label>Seu Espectro Principal (Muda a cor do perfil)</label>
                <select id="edit-espectro">
                    <option value="padrao">Nenhum (Padrão)</option>
                    <option value="igneo">Ígneo (Vermelho)</option>
                    <option value="celeste">Celeste (Azul)</option>
                    <option value="viridiano">Viridiano (Verde)</option>
                    <option value="solar">Solar (Amarelo)</option>
                    <option value="indigo">Índigo (Roxo)</option>
                    <option value="alabastro">Alabastro (Branco)</option>
                </select>
            </div>
            <button id="btn-salvar-identidade" class="btn-primario" style="margin-top: 20px; width: 100%;">Salvar Alterações</button>
        </div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/perfil.js"></script>
</body>
</html>
