<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Crônicas do Acervo - Biblioteca da 5ª Avenida</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/comunidade.css">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Biblioteca</a>
        <div class="nav-user">
            <a href="mestre.html" class="btn-secundario" style="padding: 6px 12px; font-size: 0.95rem; text-decoration: none;">🛡️ Escudo do Guardião</a>
            <a href="perfil.html" id="status-login" class="status-login-nav">🔴 Offline</a>
            <button id="btn-login" class="btn-login-nav">Entrar com Google</button>
        </div>
    </nav>

    <div class="comunidade-container">
        <!-- PAINEL DE ESCRITA -->
        <aside class="painel-escrita">
            <h2 id="form-titulo-cabecalho">Registrar Nova Crônica</h2>
            <input type="hidden" id="edit-cronica-id" value="">
            <input type="hidden" id="edit-cronica-origem" value="cronicas">

            <div class="form-card">
                <div class="input-group">
                    <label for="cronica-titulo">Título da Missão / Crônica</label>
                    <input type="text" id="cronica-titulo" placeholder="Ex: O Silêncio da Ala Oeste">
                </div>

                <div class="row-inputs">
                    <div class="input-group">
                        <label for="cronica-espectro">Espectro Dominante</label>
                        <select id="cronica-espectro">
                            <option value="Índigo">🟣 Índigo (Mistério/Criação)</option>
                            <option value="Ígneo">🔴 Ígneo (Ação/Sacrifício)</option>
                            <option value="Celeste">🔵 Celeste (Ordem/Investigação)</option>
                            <option value="Viridiano">🟢 Viridiano (Vida/Exploração)</option>
                            <option value="Solar">🟡 Solar (Liberdade/Viagem)</option>
                            <option value="Alabastro">⚪ Alabastro (Equilíbrio/Drama)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="cronica-volume">Volume Sugerido</label>
                        <select id="cronica-volume">
                            <option value="Volume I">Volume I (Iniciantes)</option>
                            <option value="Volume II">Volume II</option>
                            <option value="Volume III">Volume III</option>
                            <option value="Volume IV">Volume IV</option>
                            <option value="Volume V+">Volume V+ (Títulos)</option>
                        </select>
                    </div>
                </div>

                <div class="row-inputs">
                    <div class="input-group">
                        <label for="cronica-genero">Gênero Literário</label>
                        <select id="cronica-genero">
                            <option value="Mistério Clássico">Mistério Clássico</option>
                            <option value="Terror Gótico">Terror Gótico</option>
                            <option value="Fantasia Sombria">Fantasia Sombria</option>
                            <option value="Suspense">Suspense</option>
                            <option value="Aventura Épica">Aventura Épica</option>
                            <option value="Drama Psicológico">Drama Psicológico</option>
                            <option value="Realismo Mágico">Realismo Mágico</option>
                            <option value="Tragédia Grega">Tragédia Grega</option>
                        </select>
                    </div>

                    <div class="input-group" style="max-width: 110px;">
                        <label for="cronica-jogadores">Arquivistas</label>
                        <input type="number" id="cronica-jogadores" min="1" max="10" value="4">
                    </div>
                </div>

                <!-- VINCULAR CRIATURAS E CHEFES DA COMUNIDADE -->
                <div class="input-group">
                    <label for="select-ameaca-comunidade">Criaturas & Chefes do Acervo (Bestiário)</label>
                    <div class="row-inputs">
                        <select id="select-ameaca-comunidade">
                            <option value="">Carregando criaturas e chefes...</option>
                        </select>
                        <button type="button" id="btn-add-ameaca" class="btn-secundario" style="padding: 6px 12px;">+ Add</button>
                    </div>
                    <div id="lista-ameacas-selecionadas" class="chips-ameacas"></div>
                </div>

                <div class="input-group">
                    <label for="cronica-arquivo">Capa da Crônica (Opcional)</label>
                    <input type="file" id="cronica-arquivo" accept="image/*">
                    <input type="url" id="cronica-imagem" placeholder="Ou cole uma URL de imagem...">
                </div>

                <div class="input-group">
                    <label for="cronica-texto">Prólogo / Relato do Arquivo</label>
                    <textarea id="cronica-texto" rows="6" placeholder="Quando a porta surgiu no fim do corredor, o Diário começou a vibrar..."></textarea>
                </div>

                <div class="checkbox-feed">
                    <input type="checkbox" id="publicar-no-feed" checked>
                    <label for="publicar-no-feed">Compartilhar também no Feed Geral da Biblioteca</label>
                </div>

                <div class="form-botoes">
                    <button id="btn-salvar-cronica" class="btn-primario">Publicar Crônica</button>
                    <button id="btn-cancelar-edicao" class="btn-secundario" style="display: none;">Cancelar Edição</button>
                </div>
                <p id="status-cronica" class="status-msg"></p>
            </div>
        </aside>

        <!-- FEED DE CRÔNICAS -->
        <main class="painel-feed">
            <div class="feed-header">
                <h2>Relatos dos Arquivistas</h2>
                <div class="feed-filtros">
                    <input type="text" id="busca-cronica" placeholder="🔍 Buscar título, autor, criatura ou gênero...">
                    <select id="filtro-espectro">
                        <option value="TODOS">Todos os Espectros</option>
                        <option value="Índigo">Índigo</option>
                        <option value="Ígneo">Ígneo</option>
                        <option value="Celeste">Celeste</option>
                        <option value="Viridiano">Viridiano</option>
                        <option value="Solar">Solar</option>
                        <option value="Alabastro">Alabastro</option>
                    </select>
                </div>
            </div>

            <div id="lista-cronicas" class="grid-cronicas"></div>
        </main>
    </div>

    <!-- MODAL DE LEITURA E INTERAÇÃO -->
    <div id="modal-cronica" class="modal-leitura">
        <div class="modal-leitura-content">
            <button class="close-btn" onclick="fecharModalCronica()" aria-label="Fechar">&times;</button>
            <img id="modal-img" src="" alt="Capa da Crônica" class="modal-capa">

            <div class="modal-badges" id="modal-badges"></div>
            <h2 id="modal-titulo">Título</h2>
            <p id="modal-autor" class="modal-meta">Autor</p>

            <!-- AMEAÇAS DA CRÔNICA -->
            <div id="modal-ameacas-box" class="modal-ameacas-box" style="display: none;">
                <strong>👹 Criaturas & Chefes desta Crônica:</strong>
                <div id="modal-ameacas-lista" class="chips-ameacas" style="margin-top: 6px;"></div>
            </div>

            <div id="modal-texto" class="modal-corpo-texto"></div>

            <div class="modal-acoes">
                <button id="btn-carregar-escudo" class="btn-escudo-modal" onclick="carregarNoEscudoMestre()">
                    🛡️ Carregar no Escudo do Mestre
                </button>
                <button id="btn-like" class="btn-curtir" onclick="alternarLike()">
                    ❤️ Apoio (<span id="qtd-likes">0</span>)
                </button>
                <button id="btn-copiar-link" class="btn-secundario" onclick="copiarLinkCronica()">
                    🔗 Link
                </button>
                <button id="btn-editar" class="btn-primario" style="display: none; width: auto;" onclick="prepararEdicao()">✏️ Editar</button>
                <button id="btn-deletar" class="btn-deletar-modal" style="display: none;">🗑️ Apagar</button>
            </div>

            <!-- ANOTAÇÕES / COMENTÁRIOS DOS ARQUIVISTAS -->
            <div class="modal-comentarios">
                <h3>Notas à Margem (<span id="qtd-comentarios">0</span>)</h3>
                <div id="lista-comentarios" class="lista-comentarios"></div>
                <div class="comentario-form">
                    <input type="text" id="input-comentario" placeholder="Deixe uma anotação neste registro...">
                    <button id="btn-enviar-comentario" class="btn-primario" style="width: auto; padding: 8px 16px;">Registrar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/comunidade.js"></script>
</body>
</html>
