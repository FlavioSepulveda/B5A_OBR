<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crônicas - B5A</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/comunidade.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Home</a>
        <div class="nav-user">
            <span id="status-login" class="status-login-nav">🔴 Offline</span>
            <button id="btn-login" class="btn-login-nav">Entrar com Google</button>
        </div>
    </nav>

    <div class="comunidade-container">
        <!-- COLUNA ESQUERDA: FORMULÁRIO -->
        <div class="painel-escrita">
            <h2>Escrever Crônica</h2>
            
            <!-- CAMPO OCULTO PARA GUARDAR O ID EM EDIÇÃO -->
            <input type="hidden" id="edit-cronica-id" value="">
            
            <div class="input-group" style="background: #111; padding: 15px; border-radius: 5px; border: 1px solid var(--gold); display: flex; flex-direction: column; gap: 10px;">
                <div class="input-group">
                    <label>Título da Missão</label>
                    <input type="text" id="cronica-titulo" placeholder="Ex: O Despertar do Tirano">
                </div>
                
                <div class="input-group">
                    <label>Qtd. de Jogadores</label>
                    <input type="number" id="cronica-jogadores" min="1" max="10" value="4">
                </div>
                
                <div class="input-group">
                    <label>Imagem da Crônica (Opcional)</label>
                    <input type="file" id="cronica-arquivo" accept="image/*" style="background: #111; color: #ccc; padding: 8px; border: 1px solid #333; border-radius: 4px;">
                    <small style="color: #888; font-size: 0.7rem; margin-top: 5px;">Ou cole um link:</small>
                    <input type="url" id="cronica-imagem" placeholder="Link da imagem (Opcional)">
                </div>

                <div class="input-group">
                    <label>Breve Resumo / Prólogo</label>
                    <textarea id="cronica-texto" rows="10" style="resize: vertical;" placeholder="A primeira vez que a Biblioteca chamou por mim..."></textarea>
                </div>
                
                <button id="btn-salvar-cronica" class="btn-primario" style="padding: 10px;">Publicar Crônica</button>
                <p id="status-cronica" style="font-size: 0.8rem; color: #888; text-align: center; margin: 0;"></p>
            </div>
        </div>

        <!-- COLUNA DIREITA: FEED -->
        <div class="painel-feed">
            <h2>Relatos dos Arquivistas</h2>
            <div id="lista-cronicas" class="grid-cronicas"></div>
        </div>
    </div>

    <!-- MODAL DE LEITURA/EDIÇÃO -->
    <div id="modal-cronica" class="modal-leitura">
        <div class="modal-leitura-content">
            <span class="close-btn" onclick="fecharModalCronica()">&times;</span>
            
            <img id="modal-img" src="" alt="Capa" class="modal-capa" style="background-color: #111;">
            
            <h2 id="modal-titulo">Título</h2>
            <p id="modal-autor" style="color: var(--gold); font-size: 0.9rem; margin-bottom: 10px;">Autor</p>
            <div id="modal-texto" style="line-height: 1.6; margin-bottom: 20px;"></div>
            
            <!-- BOTÕES DE AÇÃO -->
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="btn-like" class="btn-curtir" onclick="alternarLike()" style="flex: 1;">
                    ❤️ Curtir (<span id="qtd-likes">0</span>)
                </button>
                <button id="btn-editar" class="btn-primario" style="display: none; flex: 1;" onclick="prepararEdicao()">Editar</button>
                <button id="btn-deletar" style="display: none; background:#a83232; color:white; padding: 15px; font-size: 1.3rem; border: none; border-radius: 4px; cursor: pointer; flex: 1; font-family: 'Bebas Neue', sans-serif;">Deletar</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/comunidade.js"></script>
</body>
</html>
