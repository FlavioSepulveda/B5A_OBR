<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crônicas - B5A</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/comunidade.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">← Voltar para a Home</a>
        <div class="nav-user">
            <span id="status-login" class="status-login-nav">🔴 Offline</span>
            <button id="btn-login" class="btn-login-nav">Entrar com Google</button>
        </div>
    </nav>

    <div class="conteudo-texto" style="margin-top: 80px;">
        <h1>🌍 Crônicas da Comunidade</h1>
        <p>Todo Arquivista tem um Prólogo. Escreva a história do seu personagem abaixo.</p>
        
        <div class="input-group" style="margin-bottom: 20px; background: #111; padding: 15px; border-radius: 5px; border: 1px solid var(--gold); display: flex; flex-direction: column; gap: 10px;">
            <label style="color: var(--gold); display: block; font-size: 1.2rem;">Criar Nova Crônica</label>
            
            <div class="row-inputs">
                <div class="input-group">
                    <label>Título da Missão</label>
                    <input type="text" id="cronica-titulo" placeholder="Ex: O Despertar do Tirano">
                </div>
                <div class="input-group">
                    <label>Qtd. de Jogadores</label>
                    <input type="number" id="cronica-jogadores" min="1" max="10" value="4">
                </div>
            </div>

            <div class="input-group">
                <label>URL de uma Imagem (Opcional)</label>
                <input type="url" id="cronica-imagem" placeholder="Cole o link da imagem aqui">
            </div>

            <div class="input-group">
                <label>Breve Resumo / Prólogo</label>
                <textarea id="cronica-texto" rows="4" style="width: 100%; resize: vertical; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; font-family: 'Merriweather';" placeholder="A primeira vez que a Biblioteca chamou por mim..."></textarea>
            </div>

            <button id="btn-salvar-cronica" class="btn-primario" style="font-size: 1rem; padding: 10px;">Publicar Crônica</button>
            <p id="status-cronica" style="font-size: 0.8rem; color: #888; text-align: center; margin: 0;"></p>
        </div>

        <h3>Relatos dos Arquivistas</h3>
        <div id="lista-cronicas" class="grid-cronicas"></div>
    </div>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/comunidade.js"></script>
</body>
</html>
