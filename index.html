<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa B5A - Rolagem Global</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather:ital,wght@0,300;0,700;1,400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- MENU LATERAL E BOTÃO -->
    <button id="btn-menu" class="menu-toggle">☰ Arquivos</button>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Arquivos da Biblioteca</h2>
            <button id="btn-fechar-menu" class="close-sidebar">&times;</button>
        </div>
        <div class="sidebar-links">
            <button class="nav-btn" onclick="mudarAba('aba-rolagem')">🎲 Mesa de Rolagem</button>
            <button class="nav-btn" onclick="mudarAba('aba-ficha')">📜 Minha Ficha</button>
        </div>
        <div class="sidebar-footer">
            <p>Bestiário das Almas</p>
        </div>
    </div>

    <div id="overlay" class="overlay"></div>

    <div class="abas-container">
        <!-- ABA 1: ROLAGEM -->
        <div id="aba-rolagem" class="aba active">
            <div class="app-container">
                <div class="coluna-rolagem">
                    <h2>Registro de Rolagem</h2>
                    
                    <div class="input-group" style="background: #1a1a1a; padding: 10px; border-radius: 5px; border: 1px solid #c7a86b;">
                        <label for="sala-id" style="color: #c7a86b;">ID da Sala</label>
                        <input type="text" id="sala-id" placeholder="Ex: mesa-b5a" value="sala-padrao">
                    </div>
                    
                    <div class="input-group">
                        <label for="nome-jogador">Seu Nome / Personagem</label>
                        <input type="text" id="nome-jogador" placeholder="Ex: Kael" value="Arquivista">
                    </div>
                    
                    <div class="input-group">
                        <label for="espectro">Espectro do Ímpeto</label>
                        <select id="espectro" class="espectro-select">
                            <option value="padrao">Nenhum (Padrão)</option>
                            <option value="igneo">Ígneo (Vermelho)</option>
                            <option value="celeste">Celeste (Azul)</option>
                            <option value="viridiano">Viridiano (Verde)</option>
                            <option value="solar">Solar (Amarelo)</option>
                            <option value="indigo">Índigo (Roxo)</option>
                            <option value="alabastro">Alabastro (Branco)</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label>Tipo de Teste</label>
                        <div class="toggle-group">
                            <button type="button" class="toggle active" data-tipo="atributo">Atributo (d4)</button>
                            <button type="button" class="toggle" data-tipo="pericia">Perícia (d6)</button>
                        </div>
                    </div>
                    
                    <div class="row-inputs">
                        <div class="input-group">
                            <label for="qtd-dados">Qtd. Dados</label>
                            <input type="number" id="qtd-dados" min="0" max="10" value="2">
                        </div>
                        <div class="input-group">
                            <label for="volume">Volume</label>
                            <input type="number" id="volume" min="1" max="8" value="1">
                        </div>
                    </div>
                    
                    <button id="btn-rolar">Lançar Dados</button>
                    
                    <div id="resultado-container">
                        <div id="d12-box" class="dice-box principal">
                            <span class="dice-label">d12</span>
                            <span id="dado-d12" class="dice-value">-</span>
                        </div>
                        <div id="outros-dados-box" class="dice-box secundario">
                            <span id="label-outros" class="dice-label">2d4</span>
                            <span id="dados-outros" class="dice-value">-</span>
                        </div>
                        <div id="total-box">
                            <span id="total-visual">Aguardando rolagem...</span>
                        </div>
                        <div id="regra-texto"></div>
                    </div>
                </div>
                
                <div class="coluna-historico">
                    <h3>Crônica da Mesa</h3>
                    <ul id="lista-historico-global"></ul>
                </div>
            </div>
        </div>

        <!-- ABA 2: FICHA (APENAS IMAGEM) -->
        <div id="aba-ficha" class="aba">
            <div class="ficha-wrapper">
                <!-- COLOQUE O LINK DA SUA IMAGEM/PDF AQUI NO SRC -->
                <img src="C:\Users\Usuário\Desktop\B5A_OBR\logo preta.png" alt="Ficha da Biblioteca da 5ª Avenida" class="ficha-img">
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script>
        // Controle do Menu Lateral
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const btnMenu = document.getElementById('btn-menu');
        const btnFecharMenu = document.getElementById('btn-fechar-menu');

        function toggleMenu() { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); }
        
        btnMenu.addEventListener('click', toggleMenu);
        btnFecharMenu.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', () => { 
            sidebar.classList.remove('active'); 
            overlay.classList.remove('active'); 
        });

        // Troca de Abas
        function mudarAba(idAba) {
            document.querySelectorAll('.aba').forEach(aba => aba.classList.remove('active'));
            document.getElementById(idAba).classList.add('active');
            sidebar.classList.remove('active'); 
            overlay.classList.remove('active');
        }
    </script>
</body>
</html>
